changelog:
  categories:
    - title: Features
      labels:
        - feature

    - title: Improvements
      labels:
        - enhancement

    - title: Bug Fixes
      labels:
        - bug

    - title: Documentation
      labels:
        - documentation

    - title: "Discontinued"
      labels:
        - "wontfix"

    - title: Other Changes
      labels:
        - "*"