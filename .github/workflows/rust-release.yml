name: Rust - Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: .github/workflows/rust-test.yml
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare Linux/macOS binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/mirror dist/mirror-${{ matrix.name }}

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/mirror.exe dist/mirror-windows.exe
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Mirror ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
