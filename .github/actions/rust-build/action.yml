name: Rust - Build
description: Set up Rust and build the project

inputs:
  target:
    description: Rust compilation target
    required: false

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Build
      shell: bash
      run: |
        if [ -n "${{ inputs.target }}" ]; then
          cargo build --release --verbose --target ${{ inputs.target }}
        else
          cargo build --release --verbose
        fi
